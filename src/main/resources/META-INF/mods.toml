# Технические настройки загрузчика
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Ссылки (будут кликабельными в меню модов)
issueTrackerURL="https://github.com/ваша-студия/antiqua-tempora/issues"
#displayURL="https://curseforge.com/minecraft/mc-mods/ваша-ссылка"

# Главный блок информации о вашем моде
[[mods]]
modId="antiqua_tempora_mod"
version="${mod_version}"
displayName="Antiqua Tempora"

# --- НАСТРОЙКИ КРАСОТЫ ---

# Логотип мода. Картинка должна лежать в папке src/main/resources/
logoFile="logo.png"

# Дополнительный текст в меню
credits="Спасибо всем, кто играет с нашими модами! Создано If-Else Studios."
authors="Ваши ники (например: Alex & Zen)"

# Описание мода.
description='''
Добро пожаловать в Antiqua Tempora!

Этот мод добавляет в игру забытые артефакты, древние механизмы
и новые механики выживания.

Исследуйте мир по-новому!
'''

# --- ЗАВИСИМОСТИ (Оставляем как есть, это нужно для запуска) ---

[[dependencies.antiqua_tempora_mod]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.antiqua_tempora_mod]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
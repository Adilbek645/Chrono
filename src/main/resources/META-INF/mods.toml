# Технические настройки загрузчика (лучше оставить переменные ${...})
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Ссылки (будут кликабельными в меню модов)
issueTrackerURL="https://github.com/ваша-студия/antiqua-tempora/issues" # Ссылка, куда игроки могут писать о багах
displayURL="https://curseforge.com/minecraft/mc-mods/ваша-ссылка" # Главная страница вашего мода (можно пока закомментировать, если её нет)

# Главный блок информации о вашем моде
[[mods]]
modId="antiqua_tempora_mod" # ID вашего мода (обязательно строчными буквами и через подчеркивание)
version="${mod_version}"
displayName="Antiqua Tempora" # Красивое название, которое увидит игрок в меню

# --- НАСТРОЙКИ КРАСОТЫ ---

# Логотип мода. Картинка должна лежать в папке src/main/resources/
logoFile="logo.png"

# Дополнительный текст в меню
credits="Спасибо всем, кто играет с нашими модами! Создано If-Else Studios."
authors="Ваши ники (например: Alex & Zen)"

# Описание мода. Переменная подтянет его из gradle.properties,
# но можно написать текст прямо здесь, между тройными кавычками:
description='''
Добро пожаловать в Antiqua Tempora!

Этот мод добавляет в игру забытые артефакты, древние механизмы
и новые механики выживания.

Исследуйте мир по-новому!
'''

# --- ЗАВИСИМОСТИ (Оставляем как есть, это нужно для запуска) ---

[[dependencies.antiqua_tempora_mod]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.antiqua_tempora_mod]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"